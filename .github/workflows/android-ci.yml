name: Android CI

on:
  push:
    paths:
      - "VA/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "VA/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository's wrapper JAR is missing GradleWrapperMain, so use the
      # official Gradle distribution directly until the wrapper is repaired.
      - name: Install Gradle 8.7
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.7-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Run unit tests and assemble debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" -p VA testDebugUnitTest assembleDebug --no-daemon --stacktrace
