name: Windows companion CI

on:
  push:
    branches:
      - main
      - fix/assistant-hardening-ai-chat
      - feature/adaptive-jarvis-windows
    paths:
      - "WindowsCompanion/**"
      - ".github/workflows/windows-companion-ci.yml"
  pull_request:
    paths:
      - "WindowsCompanion/**"
      - ".github/workflows/windows-companion-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowsCompanion/Jarvis.Windows.csproj

      - name: Build
        run: dotnet build WindowsCompanion/Jarvis.Windows.csproj --configuration Release --no-restore
